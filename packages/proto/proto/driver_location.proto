syntax = "proto3";

package goto.v1;

import "common.proto";

message SetPositionRequest {
  string driver_id = 1;
  LatLng position = 2;
}

message GetPositionsRequest {}

message GetPositionsResponse {
  repeated Driver driver = 1;
}

message SetPositionResponse {
  bool ok = 1;
}

message StreamPositionsResponse {
  bool ok = 1;
  uint32 received = 2;
}

service DriverPositionService {
  rpc SetPosition(SetPositionRequest) returns (SetPositionResponse);
  rpc StreamPositions(stream LatLng) returns (StreamPositionsResponse);
  rpc GetPositions(GetPositionsRequest) returns (GetPositionsResponse);
}
